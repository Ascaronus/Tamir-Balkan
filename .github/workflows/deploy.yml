name: Deploy TAMIR
run-name: Deploy TAMIR · ${{ inputs.sha }}

# Выпуск на прод — только вручную (ТЗ §2): push в main запускает Verify, а затем
# автоматически поднимается staging. Прод ждёт решения человека: workflow_dispatch
# с sha коммита, который уже прошёл Verify в main. Никаких автоматических триггеров.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "40-символьный SHA коммита из main, прошедшего Verify"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: tamir-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Ручной запуск разрешён только с main: dispatch с другой ветки
    # иначе выполнял бы деплой с секретами VPS_* и кодом этой ветки.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Confirm the commit passed Verify on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ inputs.sha }}
          # Job без checkout: gh не может развернуть свои плейсхолдеры владельца
          # и репозитория, поэтому путь к API собираем из github.repository явно.
          GH_REPO_PATH: ${{ github.repository }}
          VERIFY_WORKFLOW: verify.yml
        run: |
          set -Eeuo pipefail
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to deploy: 'sha' must be a full 40-character commit SHA ('${VERIFIED_SHA}')." >&2
            exit 1
          fi

          # Прод обязан выпускать код из main: compare с main даёт status behind|identical,
          # если коммит действительно предок main (и diverged/ahead — если нет).
          relation="$(gh api "repos/$GH_REPO_PATH/compare/main...$VERIFIED_SHA" --jq '.status')"
          if [[ "$relation" != "behind" && "$relation" != "identical" ]]; then
            echo "Refusing to deploy: $VERIFIED_SHA is not reachable from main (compare status: $relation)." >&2
            exit 1
          fi

          # Verify обязан быть зелёным именно на этом коммите, а не «когда-то на main».
          # Смотрим на запуски самого verify-воркфлоу (workflow_runs), а не на check-suites:
          # в сюиты попадают прогоны и других воркфлоу на том же SHA (в т.ч. staging-деплоя),
          # из-за чего SHA «отравлялся» чужим failure. Фильтр по head_branch+event отсекает
          # прогоны того же SHA из PR и других веток.
          runs="$(gh api --paginate "repos/$GH_REPO_PATH/actions/workflows/$VERIFY_WORKFLOW/runs?head_sha=$VERIFIED_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.head_branch == "main" and (.event == "push" or .event == "workflow_dispatch")) | "\(.run_id) \(.status) \(.conclusion)"')"
          if [[ -z "$runs" ]]; then
            echo "Refusing to deploy: $VERIFY_WORKFLOW has no completed run on main for $VERIFIED_SHA." >&2
            exit 1
          fi
          echo "$runs"
          if grep -vqE ' completed (success|neutral|skipped)$' <<< "$runs"; then
            echo "Refusing to deploy: $VERIFY_WORKFLOW did not finish successfully on $VERIFIED_SHA." >&2
            exit 1
          fi
          echo "Deploying ${VERIFIED_SHA}: Verify is green and the commit is reachable from main."

      - name: Deploy the verified commit to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VERIFIED_SHA: ${{ inputs.sha }}
          VERIFIED_RUN: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail

          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_PORT:?Missing VPS_PORT}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"

          # Pin the release to the exact commit Verify ran on; the previous step proved
          # that this SHA is green on main, so the VPS side only re-checks ancestry.
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to deploy: the event context has no verified commit SHA ('${VERIFIED_SHA}')." >&2
            exit 1
          fi
          echo "Deploying ${VERIFIED_SHA}, verified by run ${VERIFIED_RUN}."

          umask 077
          deploy_dir="$(mktemp -d)"
          trap 'rm -rf "$deploy_dir"' EXIT

          printf '%s\n' "$VPS_SSH_KEY" > "$deploy_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$deploy_dir/known_hosts"

          # The pinned SHA is validated as 40 hex characters above, so it is safe as a remote argument.
          # The remote `deploy` wrapper must forward "$@" to scripts/deploy-vps.sh,
          # which refuses to release anything except this exact SHA from origin/main.
          ssh -T \
            -p "$VPS_PORT" \
            -i "$deploy_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o HostKeyAlias=tamir-vps \
            -o UserKnownHostsFile="$deploy_dir/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "tamir-deploy@$VPS_HOST" deploy "$VERIFIED_SHA"

name: Verify storefront and backend
on:
  push:
    branches: [main, fix/store-reliability]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20.20.2", "24"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: review_test
          POSTGRES_PASSWORD: review_test
          POSTGRES_DB: review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REVIEWS_DB_URL: postgres://review_test:review_test@127.0.0.1:5432/review_test
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint -- --quiet
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: node --test tests/reviews.integration.cjs
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: bash -n scripts/deploy-vps.sh

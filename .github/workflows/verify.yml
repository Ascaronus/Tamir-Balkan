name: Verify storefront and backend
on:
  push:
    branches: [main, fix/store-reliability]
    # Документация (docs/, openspec/, любые .md) не влияет ни на сборку, ни на продукт.
    # Если в push в main менялись только такие файлы, Verify не запускается —
    # и Deploy (триггер workflow_run от Verify на main) тоже не срабатывает,
    # прод не пересобирается и pm2 не перезапускается из-за текста в markdown.
    # Для pull_request фильтр не ставим: required-чеки защищённого main должны
    # приходить по любому PR.
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**.md'
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  # Единая очередь для всех прогонов Verify: при двух параллельных прогонах
  # Jest HTTP-тесты зависают на шаге integration tests. Новые прогоны ждут в queued,
  # самый старый queued-прогон может быть отменён новым — его нужно перезапустить.
  group: verify-global
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Matrix-джобы (Node 20 и 24) тоже выполняются по очереди: оба запускают
      # Jest HTTP и Rozetka-шаги, которые не должны идти одновременно.
      max-parallel: 1
      matrix:
        node: ["20.20.2", "24"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: review_test
          POSTGRES_PASSWORD: review_test
          POSTGRES_DB: review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REVIEWS_DB_URL: postgres://review_test:review_test@127.0.0.1:5432/review_test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: review_test
      DB_PASSWORD: review_test
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://127.0.0.1:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Generate disposable build secrets
        run: |
          node - <<'NODE'
          const { randomBytes } = require('node:crypto')
          const { appendFileSync } = require('node:fs')
          for (const name of ['JWT_SECRET', 'COOKIE_SECRET']) {
            appendFileSync(process.env.GITHUB_ENV, `${name}=${randomBytes(32).toString('hex')}\n`)
          }
          NODE
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint -- --quiet
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node test-support/verify-localized-routes.mjs
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Guard test database env
        run: node test-support/guard-env.cjs --require-env
        working-directory: backend
      - name: Backend unit tests (no DB, auto-discovered)
        run: npm run test:cjs -- --no-db --junit-dir=reports
        working-directory: backend
      - name: Rozetka import pipeline test (isolated _import_test DB)
        run: |
          createdb -h 127.0.0.1 -U review_test tamir_balkan_import_test || true
          DATABASE_URL=postgres://review_test:review_test@127.0.0.1:5432/tamir_balkan_import_test npx medusa db:migrate
          DATABASE_URL=postgres://review_test:review_test@127.0.0.1:5432/tamir_balkan_import_test npx medusa exec ./src/scripts/setup-reviews.ts
          DATABASE_URL=postgres://review_test:review_test@127.0.0.1:5432/tamir_balkan_import_test npx medusa exec ./tests/rozetka-native.ts
        working-directory: backend
        env:
          PGPASSWORD: review_test
      - name: Backend integration tests (DB, auto-discovered)
        run: npm run test:cjs -- --db-only --junit-dir=reports
        working-directory: backend
      - name: Backend HTTP integration tests (Jest, medusaIntegrationTestRunner)
        run: npm run test:integration:http -- --json --outputFile=reports/jest-http.json
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-node-${{ matrix.node }}
          path: backend/reports/
          retention-days: 14
          if-no-files-found: ignore
      - run: node test-support/verify-deploy-dispatch.mjs
      - run: |
          for sh in scripts/*.sh; do bash -n "$sh"; done
      - run: node test-support/verify-deploy-pin.mjs
